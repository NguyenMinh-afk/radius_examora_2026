services:
  postgres-db:
    image: postgres:15
    container_name: examora-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Exam_Bank
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema_optimized.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: examora-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: StrongPassword123
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/User_Service
      dockerfile: Dockerfile
    container_name: examora-user-service
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/User_Service/.env.docker
    environment:
      PORT: 5000
      RABBITMQ_URL: amqp://admin:StrongPassword123@rabbitmq:5672
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
      - rabbitmq

  exam-service:
    build:
      context: ./backend/Exam_Service
      dockerfile: Dockerfile
    container_name: examora-exam-service
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/Exam_Service/.env.docker
    environment:
      PORT: 3001
      RABBITMQ_URL: amqp://admin:StrongPassword123@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      - postgres-db
      - rabbitmq

  question-service:
    build:
      context: ./backend/Question_Service
      dockerfile: Dockerfile
    container_name: examora-question-service
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/Question_Service/.env.docker
    environment:
      PORT: 3002
      RABBITMQ_URL: amqp://admin:StrongPassword123@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      - postgres-db
      - rabbitmq

  ai-generation-service:
    build:
      context: ./backend/AI_Generation_Service
      dockerfile: Dockerfile
    container_name: examora-ai-generation-service
    working_dir: /app
    volumes:
      - ./backend/AI_Generation_Service:/app
      - ai-generation-node-modules:/app/node_modules
      - ./backend/shared:/shared:ro
    command: ["node", "src/server.js"]
    env_file:
      - ./backend/AI_Generation_Service/.env.docker
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      - postgres-db
      - rabbitmq

  ai-worker-api:
    build:
      context: ./backend/AI_Worker_Service
      dockerfile: Dockerfile
    container_name: examora-ai-worker-api
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/AI_Worker_Service:/app
      - ./backend/AI_Worker_Service/data:/app/data
    env_file:
      - ./backend/AI_Worker_Service/.env.docker
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-worker-service:
    build:
      context: ./backend/AI_Worker_Service
      dockerfile: Dockerfile
    container_name: examora-ai-worker-service
    working_dir: /app
    volumes:
      - ./backend/AI_Worker_Service:/app
      - ./backend/AI_Worker_Service/data:/app/data
    env_file:
      - ./backend/AI_Worker_Service/.env.docker
    command: ["python", "run_worker.py"]
    depends_on:
      postgres-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/Notification_Service
      dockerfile: Dockerfile
    container_name: examora-notification-service
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/Notification_Service/.env.docker
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      - postgres-db
      - rabbitmq

  infrastructure-service:
    build:
      context: ./backend/Infrastructure_Service
      dockerfile: Dockerfile
    container_name: examora-infrastructure-service
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/Infrastructure_Service/.env.docker
    environment:
      PORT: 5005
    ports:
      - "5005:5005"
    depends_on:
      postgres-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend/API_Gateway_Service
      dockerfile: Dockerfile
    container_name: examora-api-gateway
    volumes:
      - ./backend/shared:/shared:ro
    env_file:
      - ./backend/API_Gateway_Service/.env.docker
    environment:
      PORT: 3000
    ports:
      - "3100:3000"
    depends_on:
      - user-service
      - exam-service
      - question-service
      - ai-generation-service
      - notification-service
      - infrastructure-service
      - postgres-db
      - rabbitmq

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examora-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3100
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:latest
    container_name: examora-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: examora-grafana
    ports:
      - "3006:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  ai-generation-node-modules:
  grafana-data:
  prometheus-data:
