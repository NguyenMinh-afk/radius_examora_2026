name: Node.js CI

on:
  push:
    branches:
      - main
      - Developer
    paths:
      - 'backend/User_Service/**'
      - 'backend/Exam_Service/**'
      - 'backend/Question_Service/**'
      - 'backend/AI_Generation_Service/**'
      - 'backend/Notification_Service/**'
      - 'backend/Infrastructure_Service/**'
      - 'backend/API_Gateway_Service/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    branches:
      - main
      - Developer
    paths:
      - 'backend/User_Service/**'
      - 'backend/Exam_Service/**'
      - 'backend/Question_Service/**'
      - 'backend/AI_Generation_Service/**'
      - 'backend/Notification_Service/**'
      - 'backend/Infrastructure_Service/**'
      - 'backend/API_Gateway_Service/**'

env:
  NODE_VERSION: '20'

jobs:
  # Lint all Node.js services
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - User_Service
          - Exam_Service
          - Question_Service
          - AI_Generation_Service
          - Notification_Service
          - Infrastructure_Service
          - API_Gateway_Service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend/${{ matrix.service }}

      - name: Run ESLint
        run: npm run lint --if-present
        working-directory: backend/${{ matrix.service }}

