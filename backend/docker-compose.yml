services:
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Exam_Bank
    ports:
      - "5432:5432"
    volumes:
      - ../database/schema_optimized.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: StrongPassword123
    restart: unless-stopped

  user-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./User_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./User_Service/.env
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
      - rabbitmq

  exam-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Exam_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./Exam_Service/.env
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres-db
      - rabbitmq

  question-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Question_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./Question_Service/.env
    environment:
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - postgres-db
      - rabbitmq

  ai-generation-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./AI_Generation_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./AI_Generation_Service/.env
    environment:
      - PORT=3003
    ports:
      - "3003:3003"
    depends_on:
      - postgres-db
      - rabbitmq

  api-gateway:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./API_Gateway_Service:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=3000
    ports:
      - "3100:3000"
    depends_on:
      - user-service
      - postgres-db
      - rabbitmq

  infrastructure-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Infrastructure_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./Infrastructure_Service/.env
    environment:
      - PORT=5005
    ports:
      - "5005:5005"
    depends_on:
      - postgres-db
      - rabbitmq

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  notification-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Notification_Service:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./Notification_Service/.env
    environment:
      - PORT=3004
    ports:
      - "3004:3004"
    depends_on:
      - rabbitmq

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - user-service

volumes:
  grafana-data:
  prometheus-data: