services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_user:ai_password@postgres:5432/ai_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USE_RABBITMQ: "true"
      RAW_UPLOAD_DIR: ./data/raw
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_user:ai_password@postgres:5432/ai_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USE_RABBITMQ: "true"
      RAW_UPLOAD_DIR: ./data/raw
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "run_worker.py"]

volumes:
  postgres_data: