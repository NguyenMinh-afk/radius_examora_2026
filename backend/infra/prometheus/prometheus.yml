global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'exmora'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:3000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-gateway'

  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'user-service'

  - job_name: 'exam-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['exam-service:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'exam-service'

  - job_name: 'question-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['question-service:3002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'question-service'

  - job_name: 'ai-generation-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-generation-service:3003']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-generation-service'

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:3004']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'notification-service'

  - job_name: 'infrastructure-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['infrastructure-service:3005']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'infrastructure-service'

  - job_name: 'ai-worker-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-worker-service:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-worker-service'
